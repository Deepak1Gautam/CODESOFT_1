<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">

<defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#06131f"/>
        <stop offset="50%" stop-color="#0f172a"/>
        <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
</defs>

<!-- Background -->
<rect width="1200" height="420" rx="30" fill="url(#background)"/>

<!-- Decorative Circles -->
<circle cx="100" cy="80" r="4" fill="#38bdf8">
    <animate attributeName="cy" values="80;50;80" dur="3s" repeatCount="indefinite"/>
</circle>

<circle cx="1100" cy="100" r="4" fill="#38bdf8">
    <animate attributeName="cy" values="100;140;100" dur="4s" repeatCount="indefinite"/>
</circle>

<circle cx="600" cy="50" r="3" fill="#7c3aed">
    <animate attributeName="cx" values="600;650;600" dur="4s" repeatCount="indefinite"/>
</circle>

<!-- Floating Code -->
<text x="80" y="190"
      font-family="monospace"
      font-size="32"
      fill="#38bdf8"
      opacity="0.8">
    &lt;/&gt;
</text>

<text x="1050" y="280"
      font-family="monospace"
      font-size="32"
      fill="#7c3aed"
      opacity="0.8">
    { }
</text>

<!-- Main Text -->
<text x="100" y="170"
      font-family="Arial"
      font-size="58"
      font-weight="bold"
      fill="white">
    Deepak Gautam
</text>

<text x="105" y="220"
      font-family="Arial"
      font-size="25"
      fill="#38bdf8">
    Computer Engineering Student
</text>

<text x="105" y="265"
      font-family="Arial"
      font-size="20"
      fill="#cbd5e1">
    Web Developer • Python Developer • Software Engineer
</text>

<!-- Animated Line -->
<rect x="105" y="300"
      width="350"
      height="4"
      rx="4"
      fill="#38bdf8">
    <animate attributeName="width"
             values="80;350;80"
             dur="4s"
             repeatCount="indefinite"/>
</rect>

<!-- Laptop -->
<g transform="translate(760,100)">

    <!-- Screen -->
    <rect width="330"
          height="210"
          rx="15"
          fill="#020617"
          stroke="url(#glow)"
          stroke-width="5"/>

    <!-- Code -->
    <text x="25" y="50"
          font-family="monospace"
          font-size="16"
          fill="#38bdf8">
        const developer = "Deepak";
    </text>

    <text x="25" y="85"
          font-family="monospace"
          font-size="16"
          fill="#a78bfa">
        function buildFuture() {
    </text>

    <text x="45" y="120"
          font-family="monospace"
          font-size="16"
          fill="#22d3ee">
        return "Innovation";
    </text>

    <text x="25" y="155"
          font-family="monospace"
          font-size="16"
          fill="#a78bfa">
        }
    </text>

    <text x="25" y="190"
          font-family="monospace"
          font-size="16"
          fill="#38bdf8">
        &gt; coding...
    </text>

    <!-- Laptop Base -->
    <path d="M-35 220 H365 L400 250 H-70 Z"
          fill="#1e293b"
          stroke="#38bdf8"
          stroke-width="3"/>

</g>

</svg>
